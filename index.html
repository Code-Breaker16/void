<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Void</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Black+Ops+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div class="container">
      <div id="clock">00:00:00</div>
      <div id="greeting">hello</div>

      <form action="https://www.google.com/search" method="GET" class="search-form">
        <input type="text" name="q" placeholder="search...." autocomplete="off" autofocus/>
      </form>

      <div class="pomo">
        <div id="pomo-display">25:00</div>
        <div class="pomo-controls">
          <button id="pomo-toggle">start</button>
          <button id="pomo-reset">reset</button>
        </div>
      </div>

      <div id="app" class="apod-box"></div>

      <div class="shortcuts">
        <a href="https://youtube.com" class="card" target="_blank">youtube</a>
        <a href="https://stardance.hackclub.com/" class="card" target="_blank">stardance</a>
        <a href="https://hackclub.com/" class="card" target="_blank">Hack Club</a>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
